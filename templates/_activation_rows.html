{% for r in rows %}
<tr data-list-row>
  <td>{{ r.patient_id }}</td><td>{{ r.history_id }}</td>
  <td class="center"><input type="checkbox" data-history-status data-history="{{ r.history_id }}" aria-label="Ενεργό ιστορικό {{ r.history_id }}" {% if r.is_active %}checked{% endif %}></td>
  <td class="center"><input type="checkbox" class="autosave" data-table="clinical_histories" data-pk="{{ r.history_id }}" data-column="today" value="1" aria-label="Ημερήσια για το ιστορικό {{ r.history_id }}" {% if r.today %}checked{% endif %}></td>
  <td>{{ r.first_name or '' }}</td><td>{{ r.last_name or '' }}</td><td>{{ r.history_date|grdate }}</td><td>{{ r.main_diagnosis or '' }}</td><td>{{ r.mobile_phone or '' }}</td>
</tr>
{% else %}
{% if not request.args.get('offset') %}<tr data-empty-row><td colspan="9" class="empty">Δεν βρέθηκαν ιστορικά.</td></tr>{% endif %}
{% endfor %}
